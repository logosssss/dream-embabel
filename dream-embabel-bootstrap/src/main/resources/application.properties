# 没有 key 时占位模型的名字。openai / deepseek profile 会覆盖它。
embabel.models.default-llm=local
embabel.models.llms.writer=local
embabel.models.llms.reviewer=local
# shell 启动器默认把 Web 类型写成 none，Tomcat 不会监听。servlet 才会打开 8080。
embabel.agent.shell.web-application-type=servlet
# starter 在 classpath 上，但没有 key 时不要跑 OpenAI 自动配置，否则构造器会因缺少 key 失败。
spring.autoconfigure.exclude=com.embabel.agent.autoconfigure.models.openai.AgentOpenAiAutoConfiguration
dreamembabel.model-probe.enabled=true
logging.level.com.zhu.embabel.plan=INFO
# 日志人格。starwars 会注册星战语气的监听器，作用是全部 Agent 日志，不只这一页。
embabel.agent.logging.personality=starwars
dreamembabel.review.draft-words=400
dreamembabel.review.review-words=200
dreamembabel.review.final-words=500
dreamembabel.review.min-score=60
dreamembabel.review.confirm=true
dreamembabel.mcp.echo.enabled=true
# 默认关闭，测试和本地启动不连接 Milvus。打开后向量检索走 Milvus，全文和相邻片段仍走 Lucene。
dreamembabel.rag.milvus.enabled=true
dreamembabel.rag.milvus.host=${MILVUS_HOST:127.0.0.1}
dreamembabel.rag.milvus.port=19530
dreamembabel.rag.milvus.database=default
dreamembabel.rag.milvus.collection=style_guide
# 服务器开了认证时填写。留空则不带账号。不要把密码提交进仓库。
dreamembabel.rag.milvus.username=${MILVUS_USERNAME:}
dreamembabel.rag.milvus.password=${MILVUS_PASSWORD:}
# 进程快照写入 MySQL。先执行 db/agent-process-snapshots-mysql.sql。库名改 URL 里的 dream_embabel。
embabel.agent.platform.persistence.provider=jdbc
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:127.0.0.1}:3306/dream_embabel?characterEncoding=utf8&serverTimezone=Asia/Shanghai
spring.datasource.username=${MYSQL_USERNAME:}
spring.datasource.password=${MYSQL_PASSWORD:}
