# 核实日期 2026-10-22，来源 https://api-docs.deepseek.com/
# base_url=https://api.deepseek.com ，对话模型 deepseek-flash（当前由 DeepSeek-V4.1-Flash-1017 提供）。
# deepseek-v4-flash 仍是官方接受的旧别名。Embabel 1.5.3 的 DeepSeekModels.DEEPSEEK_V4_FLASH 仍是该旧名。
# 属性名来自 embabel-agent-openai-autoconfigure 1.5.3 的 spring-configuration-metadata.json。
dreamembabel.model-probe.enabled=true
embabel.agent.platform.models.openai.base-url=https://api.deepseek.com
embabel.agent.platform.models.openai.api-key=${DEEPSEEK_API_KEY}
embabel.models.default-llm=deepseek-flash
embabel.agent.platform.ranking.llm=deepseek-flash
